synthetic_cases:
  - case_id: iron-deficiency-pattern
    gold: Iron deficiency anemia
    support: strong
    facts_verified: 4
    rationale: Microcytic anemia with low ferritin and low transferrin saturation.
    acceptable_equivalents:
      - Iron-deficiency anaemia
      - Microcytic iron-deficiency anemia
    human_signoff: pending
  - case_id: diabetic-ketoacidosis-pattern
    gold: Diabetic ketoacidosis
    support: strong
    facts_verified: 4
    rationale: Hyperglycemia, acidemia, low bicarbonate and positive blood ketones.
    acceptable_equivalents:
      - DKA
      - Acute diabetic ketoacidosis
    human_signoff: pending
  - case_id: primary-hypothyroid-pattern
    gold: Primary hypothyroidism
    support: strong
    facts_verified: 4
    rationale: High TSH, low free T4 and positive anti-TPO antibodies.
    acceptable_equivalents:
      - Primary autoimmune hypothyroidism
      - Hashimoto hypothyroidism
    human_signoff: pending
  - case_id: community-pneumonia-pattern
    gold: Community-acquired pneumonia
    support: strong
    facts_verified: 4
    rationale: Acute respiratory syndrome with focal crackles and a new right lower lobe opacity.
    acceptable_equivalents:
      - Community-acquired bacterial pneumonia
      - Right lower lobe community-acquired pneumonia
    human_signoff: pending
  - case_id: vitamin-b12-pattern
    gold: Vitamin B12 deficiency
    support: strong
    facts_verified: 4
    rationale: Low vitamin B12, macrocytosis, neurologic symptoms and positive intrinsic factor antibody.
    acceptable_equivalents:
      - Cobalamin deficiency
      - Pernicious anemia with vitamin B12 deficiency
    human_signoff: pending
  - case_id: celiac-pattern
    gold: Celiac disease
    support: strong
    facts_verified: 4
    rationale: Elevated tissue transglutaminase IgA with normal total IgA and compatible duodenal histology.
    acceptable_equivalents:
      - Coeliac disease
      - Gluten-sensitive enteropathy
    human_signoff: pending
  - case_id: glomerulonephritis-pattern
    gold: Lupus nephritis
    support: strong_pattern_without_histologic_class
    facts_verified: 4
    rationale: Proteinuria, dysmorphic red cells, low C3, high anti-dsDNA and systemic lupus features.
    caution: Do not require or infer a histologic lupus nephritis class without biopsy.
    acceptable_equivalents:
      - SLE nephritis
      - Systemic lupus erythematosus nephritis
    human_signoff: pending
  - case_id: pulmonary-embolism-pattern
    gold: Pulmonary embolism
    support: strong
    facts_verified: 4
    rationale: Acute symptoms after surgery with hypoxemia and a segmental filling defect on CT angiography.
    acceptable_equivalents:
      - Acute pulmonary embolism
      - Postoperative pulmonary embolism
    human_signoff: pending
  - case_id: heart-failure-pattern
    gold: Acute decompensated heart failure
    support: strong
    facts_verified: 4
    rationale: Orthopnea, edema, rapid weight gain, high BNP, reduced ejection fraction and interstitial opacities.
    caution: Cardiogenic pulmonary edema alone is a complication and should not automatically count as equivalent.
    acceptable_equivalents:
      - Acute decompensated HFrEF
      - Acute systolic heart failure
    human_signoff: pending
  - case_id: dated-potassium-contradiction
    gold: Acute kidney injury with resolved hyperkalemia
    support: adequate_with_baseline_caveat
    facts_verified: 5
    rationale: Reduced urine output after gastroenteritis with creatinine and potassium improving after intravenous fluids.
    caution: Baseline creatinine is absent; do not claim that the kidney injury itself fully resolved.
    acceptable_equivalents:
      - Prerenal acute kidney injury with resolved hyperkalemia
      - Acute kidney injury with corrected hyperkalemia
    human_signoff: pending

dataset_findings:
  - severity: medium
    finding: Several transformed scan images clip the left edge of headings or context text.
    affected_cases:
      - diabetic-ketoacidosis-pattern
      - celiac-pattern
      - heart-failure-pattern
    impact: Expected facts remain visible, but the artifact is less representative of a clean scan.
    recommendation: Keep for robustness testing, but add unclipped controls before using the set as a production gate.
  - severity: medium
    finding: Synthetic medical panels are schematic rather than diagnostically realistic.
    affected_cases:
      - community-pneumonia-pattern
      - pulmonary-embolism-pattern
      - heart-failure-pattern
    impact: They validate routing and text preservation, not true medical-image interpretation.
    recommendation: Add real difficult mixed-image controls with appropriate rights and clinical review.
  - severity: medium
    finding: The strict LLM judge changed one obvious pneumonia equivalence from reject to accept on identical labeled input.
    impact: Single strict runs are not fully stable for unresolved semantic matches.
    recommendation: Persist judge traces and require adjudication or consensus for unstable cases.
  - severity: low
    finding: The ten synthetic cases are intentionally diagnosis-obvious.
    impact: High scores should not be presented as general clinical accuracy.
    recommendation: Add ambiguous and competing-diagnosis controls after human review.
