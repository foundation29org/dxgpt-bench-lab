      Male, 27. Four days of fever, headache, muscle and joint pain and fatigue. Mild nausea.
  - id: tuberculosis-vague
    countries: [IN]
    expected: 'tubercul'
    text: >-
      Male, 41. Persistent cough for five weeks, tiredness, low-grade fever and some weight loss.
  - id: typhoid-vague
    countries: [PK]
    expected: 'typhoid|enteric fever|salmonella'
    text: >-
      Female, 19. Ten days of fever with headache, abdominal discomfort and tiredness.
  - id: leptospirosis-vague
    countries: [PH]
    expected: 'leptospir|weil'
