  - id: sickle-cell-vague
    countries: [NG]
    expected: 'sickle'
    text: >-
      Child, 6. Recurrent episodes of severe bone and abdominal pain, and mild anemia.
  - id: rheumatic-heart-vague
    countries: [IN, NG]
    expected: 'rheumatic'
    text: >-
      Female, 17. Increasing breathlessness on exertion and palpitations for three months.
  - id: cholera-vague
    countries: [BD]
    expected: 'cholera|vibrio'
    text: >-
      Male, 30. Watery diarrhea and vomiting for 12 hours with muscle cramps.
  - id: melioidosis-vague
    countries: [TH]
    expected: 'melioid|burkholderia'
    text: >-
      Male, 55. Diabetic. Ten days of fever and cough, now with skin abscesses.

controls:
  - id: viral-uri
    countries: [NG, IN]
    expected: 'influenza|common cold|viral|upper respiratory|covid|pharyngitis'
    text: >-
      Female, 29. Fever, cough, sore throat, runny nose and mild body aches for three days.
  - id: migraine
    countries: [NG, IN]
    expected: 'migraine'
    text: >-
      Female, 28. Throbbing one-sided headache with nausea and sensitivity to light lasting
      12 hours; similar episodes every month since age 20.
  - id: myocardial-infarction
    countries: [NG, IN]
    expected: 'myocardial infarction|acute coronary|heart attack'
    text: >-
      Male, 56. Crushing chest pain radiating to the left arm for 40 minutes with sweating.
      Smoker with high blood pressure.
  - id: cystitis
    countries: [NG, IN]
    expected: 'urinary tract infection|cystitis'
    text: >-
      Female, 33. Burning and frequent urination with lower abdominal pain for two days.
      No fever.
  - id: strep-pharyngitis
    countries: [NG, IN]
    expected: 'strep|tonsillitis|pharyngitis|mononucleosis'
    text: >-
      Male, 24. Fever and severe sore throat with white patches on the tonsils and tender
      neck lymph nodes. No cough.
