    countries: [BR]
    expected: 'chagas|trypanosom'
    text: >-
      Male, 52. Gradually worsening breathlessness, ankle swelling and palpitations over a year.
  - id: neurocysticercosis-vague
    countries: [MX, IN]
    expected: 'cysticerc|taenia'
    text: >-
      Male, 29. First seizure after two months of headaches. MRI shows multiple small brain lesions.
  - id: schistosomiasis-vague
    countries: [NG]
    expected: 'schistosom|bilharzi'
    text: >-
      Male, 14. Blood in the urine for two months. No fever and no pain when urinating.
  - id: scrub-typhus-vague
    countries: [IN]
    expected: 'scrub typhus|orientia|tsutsugamushi'
    text: >-
