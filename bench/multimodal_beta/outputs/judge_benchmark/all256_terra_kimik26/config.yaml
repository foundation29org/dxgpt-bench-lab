EXPERIMENT_NAME: judge-audit-strict-all_256_clean Terra low frozen judge benchmark
EXPERIMENT_DESCRIPTION: Strict re-score of all_256_clean Terra low frozen judge benchmark
  from existing evaluation_details. No new inference or MedLabeler.
DXGPT_EMULATOR:
  MODEL: all_256_clean Terra low frozen judge benchmark
  CANDIDATE_PROMPT_PATH: bench/candidate-prompts/juanjo_classic_v2.txt
  PARAMS:
    reasoning_effort: low
EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.8
