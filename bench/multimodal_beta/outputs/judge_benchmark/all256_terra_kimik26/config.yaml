  GOLD_ONTOLOGY: source_run
  NORMALIZATION: reused_from_evaluation_details
  LLM_MATCH_MODE: strict_equivalence
  SOURCE_EVALUATION_DETAILS: C:\repos\DxGPT\eval\bench\pipelines\pipeline_v4 - fork\main\output\all_256_clean\juanjo_classic_v2\gpt_5_6_terra_low_translated_en\20260710140614\evaluation_details.txt
