EXPERIMENT_NAME: pilot250_gpt56terra_TI_phrase
EXPERIMENT_DESCRIPTION: MedReaMM T+I gpt56terra n=250 with image phrase
DXGPT_EMULATOR:
  MODEL: gpt56terra
  CANDIDATE_PROMPT_PATH: Server/assets/prompts.js
  PARAMS:
    reasoning_effort: low
EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.8
  BERT_AUTOCONFIRM_THRESHOLD: 0.9
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: gemini-2.5-pro
  JUDGE_PARAMS:
    thinking_level: low
    max_tokens: 10000
    temperature: 0.1
  PARALLEL_WORKERS: 8
MULTIMODAL_BETA:
  GOLD_SCOPE: primary
  GOLD_ONTOLOGY: ICD-11
  NORMALIZATION: Azure Health Text Analytics
  LLM_MATCH_MODE: strict_equivalence
  SOURCE_RESPONSES: C:\repos\DxGPT\eval\bench\multimodal_beta\outputs\pilot250_gpt56terra_TI_phrase\responses.jsonl
