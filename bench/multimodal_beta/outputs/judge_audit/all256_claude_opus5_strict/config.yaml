EXPERIMENT_NAME: judge-audit-strict-claude-opus-5
EXPERIMENT_DESCRIPTION: Strict re-score of claude-opus-5 from existing evaluation_details.
  No new inference or MedLabeler.
DXGPT_EMULATOR:
  MODEL: claude-opus-5
  CANDIDATE_PROMPT_PATH: bench/candidate-prompts/juanjo_classic_v2.txt
  PARAMS:
    reasoning_effort: low
EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.8
  BERT_AUTOCONFIRM_THRESHOLD: 0.9
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: gemini-2.5-pro
  JUDGE_PARAMS:
    thinking_level: low
    max_tokens: 10000
    temperature: 0.1
  JUDGE_MAX_ATTEMPTS: 3
  JUDGE_RETRY_DELAY_SECONDS: 2
  PARALLEL_WORKERS: 8
MULTIMODAL_BETA:
  GOLD_SCOPE: primary
  GOLD_ONTOLOGY: source_run
  NORMALIZATION: reused_from_evaluation_details
  BERT_SCORES: reused_from_source_evaluation_trace
  LLM_MATCH_MODE: strict_equivalence
  SOURCE_EVALUATION_DETAILS: C:\repos\DxGPT\eval\bench\pipelines\pipeline_v4 - fork\main\output\all_256_clean\juanjo_classic_v2\claude_opus_5_translated_en\20260917160743\evaluation_details.txt
  SOURCE_CASE_COUNT: 256
DATASET_PATH: bench/datasets/all_256_clean.json
