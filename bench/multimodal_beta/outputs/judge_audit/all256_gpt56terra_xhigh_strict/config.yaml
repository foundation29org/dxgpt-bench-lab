EXPERIMENT_NAME: judge-audit-strict-gpt-5.6-terra-xhigh
EXPERIMENT_DESCRIPTION: Strict re-score of gpt-5.6-terra-xhigh from existing evaluation_details.
  No new inference or MedLabeler.
DXGPT_EMULATOR:
  MODEL: gpt-5.6-terra-xhigh
  CANDIDATE_PROMPT_PATH: bench/candidate-prompts/juanjo_classic_v2.txt
  PARAMS:
    reasoning_effort: low
EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.8
  BERT_AUTOCONFIRM_THRESHOLD: 0.9
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: gemini-2.5-pro
  JUDGE_PARAMS:
    thinking_level: low
    max_tokens: 10000
    temperature: 0.1
  PARALLEL_WORKERS: 8
MULTIMODAL_BETA:
  GOLD_SCOPE: primary
  GOLD_ONTOLOGY: source_run
  NORMALIZATION: reused_from_evaluation_details
  LLM_MATCH_MODE: strict_equivalence
  SOURCE_EVALUATION_DETAILS: C:\repos\DxGPT\eval\bench\multimodal_beta\outputs\judge_audit\terra_xhigh_merged_evaluation_details.txt
DATASET_PATH: bench/datasets/all_256_clean.json
