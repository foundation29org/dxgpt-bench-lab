# Pipeline V5 - claude-opus-5 low sobre hms_hpo v2
# ==============================================================
# Run completo con el mismo prompt, parametros y juez que Terra y Sol en HPO v2,
# para ver si la diferencia entre Sol y Opus en narrative_v2 (no significativa)
# se resuelve con mas casos. Opus da unas 10 opciones: R@1 y R@5 son
# comparables, la cobertura no.

EXPERIMENT_NAME: "hms_hpo_v2-juanjo_classic_v2-claude_opus_5_low-v5"
EXPERIMENT_DESCRIPTION: "claude-opus-5 low sobre hms_hpo v2 con el evaluador V5, para comparar con Sol y Terra en raras."

DATASET_PATH: "bench/datasets/hms_hpo_v2.json"

DXGPT_EMULATOR:
  MODEL: "claude-opus-5"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false
  PARALLEL_WORKERS: 6

EVALUATOR:
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1
  JUDGE_MAX_ATTEMPTS: 3
  PARALLEL_WORKERS: 8

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
