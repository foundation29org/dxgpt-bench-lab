# Pipeline V5 - re-evaluacion de gpt-5.6-terra low sobre mygene2_hpo v2
# ==============================================================
# Mismas listas DDX y codigos que el run de julio de Pipeline V4 (las del
# benchmark HPO strict de septiembre). El gold sale del dataset v2: ademas
# del gold con gen vale el nombre sin gen, y sin los casos de gold dudoso de la
# revision T3 de David (data29/data-repos/hpo-v2/README.md).
# score_blocks.py --without-clinical da la nota solo con el gold con gen sobre las
# mismas llamadas al juez.

EXPERIMENT_NAME: "mygene2_hpo_v2-juanjo_classic_v2-gpt_5_6_terra_low-v5"
EXPERIMENT_DESCRIPTION: "Pipeline V5 sobre las listas congeladas de Terra low en mygene2_hpo, con el gold v2 (gold con gen o sin gen, y limpieza T3)."

DATASET_PATH: "bench/datasets/mygene2_hpo_v2.json"

# Labeler output to re-evaluate (relative to the eval repo root)
REUSE_LABELED_DDX: "bench/pipelines/pipeline_v4 - fork/main/output/mygene2_hpo/juanjo_classic_v2/gpt_5_6_terra_low/juanjo_classic_v2___gpt_5_6_terra_low___ddxs_from_labeler.json"
REFRESH_GOLD_FROM_DATASET: true

DXGPT_EMULATOR:
  MODEL: "gpt-5.6-terra"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false
  PARALLEL_WORKERS: 4

EVALUATOR:
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1
  JUDGE_MAX_ATTEMPTS: 3
  PARALLEL_WORKERS: 8

MAIN:
  SHOULD_EMULATE: false
  SHOULD_LABEL: false
  SHOULD_EVALUATE: true

TIMESTAMP: null
