# Pipeline V5 - gpt-6.1-sol low sobre ramedis_hpo v2
# ==============================================================
# Run completo (genera, etiqueta y puntua) con el mismo prompt y parametros que
# las listas de Terra de julio (config_terra_low_ramedis_hpo_v2.yaml) y el mismo
# juez, para comparar los dos modelos en raras sobre los mismos casos.
# score_blocks.py --without-clinical da la nota solo con el gold con gen.

EXPERIMENT_NAME: "ramedis_hpo_v2-juanjo_classic_v2-gpt_6_1_sol_low-v5"
EXPERIMENT_DESCRIPTION: "gpt-6.1-sol low sobre ramedis_hpo v2 con el evaluador V5, para comparar con Terra low en raras."

DATASET_PATH: "bench/datasets/ramedis_hpo_v2.json"

DXGPT_EMULATOR:
  MODEL: "gpt-6.1-sol"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false
  PARALLEL_WORKERS: 8

EVALUATOR:
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1
  JUDGE_MAX_ATTEMPTS: 3
  PARALLEL_WORKERS: 8

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
