# Pipeline V5 - gpt-5.6-terra medium sobre narrative_v2
# ===================================================
# Run completo: Terra genera las listas, el labeler pone los codigos y el
# evaluador V5 (graded_v2) las puntua. Los casos de urgencias estan en
# espanol: TRANSLATE_CASE los pasa a ingles, como en all_256_clean.

EXPERIMENT_NAME: "narrative_v2-juanjo_classic_v2-gpt_5_6_terra_medium-v5"
EXPERIMENT_DESCRIPTION: "Esfuerzo de razonamiento medium sobre narrative_v2 (v0.1, pendiente de validacion clinica), para comparar con low. Mismo prompt, juez y evaluador V5 graded_v2."

DATASET_PATH: "bench/datasets/narrative_v2.json"

DXGPT_EMULATOR:
  MODEL: "gpt-5.6-terra"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "medium"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: true
  PARALLEL_WORKERS: 8

EVALUATOR:
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1
  JUDGE_MAX_ATTEMPTS: 3
  PARALLEL_WORKERS: 8

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
