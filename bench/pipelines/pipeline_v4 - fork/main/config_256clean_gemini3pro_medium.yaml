# Pipeline V4 Configuration — all_256_clean gemini-3-pro-preview MEDIUM
# =======================================================================
# Objetivo: comparar thinking_level medium vs low (que dio avg_pos=1.299, 98.1% en all_256_clean)
# Referencia low: avg_pos=1.299, 98.1% (251/256) — igual que gemini-2.5-pro
# ¿Medium thinking mejora avg_pos o solo añade latencia?

EXPERIMENT_NAME: "all_256_clean-juanjo_classic_v2-gemini_3_pro_preview_medium_translated_en"
EXPERIMENT_DESCRIPTION: "all_256_clean con gemini-3-pro-preview thinking_level=medium. Comparar vs low (avg_pos=1.299, 98.1%). Objetivo: ver si más razonamiento mejora posición media en texto narrativo."

DATASET_PATH: "bench/datasets/all_256_clean.json"

DXGPT_EMULATOR:
  MODEL: "gemini-3-pro-preview"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    thinking_level: "medium"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: true
    TARGET_LANGUAGE: "en"

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
