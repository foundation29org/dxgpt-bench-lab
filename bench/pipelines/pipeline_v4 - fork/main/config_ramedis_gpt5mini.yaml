# Pipeline V4 Configuration — RAMEDIS gpt-5-mini
# ================================================

EXPERIMENT_NAME: "fase2-ramedis-624-gpt54mini"
EXPERIMENT_DESCRIPTION: "RAMEDIS HPO 624 casos con gpt-5.4-mini. Comparativa vs gpt-4o (R@1=49.2%, R@5=99.4%). Objetivo: ver si el modelo más nuevo/rápido mantiene rendimiento en enfermedades raras HPO."

DATASET_PATH: "bench/datasets/ramedis_hpo.json"

DXGPT_EMULATOR:
  MODEL: "gpt-5.4-mini"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "low"
    thinking_level: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
