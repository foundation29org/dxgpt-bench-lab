EXPERIMENT_NAME: all_256_clean-juanjo_classic_v2-grok_4_6_low
EXPERIMENT_DESCRIPTION: >-
  grok-4.6 low sobre all_256_clean con el prompt vigente.
  Inferencia nueva; ranking legacy y posterior reevaluación strict.

DATASET_PATH: bench/datasets/all_256_clean.json

DXGPT_EMULATOR:
  MODEL: grok-4.6
  CANDIDATE_PROMPT_PATH: bench/candidate-prompts/juanjo_classic_v2.txt
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: low
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: bench/candidate-prompts/candidate_output_schema.json
  TRANSLATE_CASE:
    ENABLED: true
  PARALLEL_WORKERS: 4

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.8
  BERT_AUTOCONFIRM_THRESHOLD: 0.9
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: gemini-2.5-pro
  JUDGE_PARAMS:
    reasoning_effort: low
    thinking_level: low
    max_tokens: 10000
    temperature: 0.1
  PARALLEL_WORKERS: 4

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true
