# Pipeline V4 Configuration — MME gpt-4o
EXPERIMENT_NAME: "fase2-mme-40-gpt4o"
EXPERIMENT_DESCRIPTION: "MME HPO 40 casos con gpt-4o. Dataset de PUMCH (hospital chino). Completa cobertura DeepRare datasets con gpt-4o."

DATASET_PATH: "bench/datasets/mme_hpo.json"

DXGPT_EMULATOR:
  MODEL: "gpt-4o"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "low"
    thinking_level: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
