# Pipeline V4 Configuration — ddd_hpo pilot 50 casos con gpt-4o
# =================================================================
# Primer run del dataset DDD (Gene2Phenotype, 1749 casos).
# Pilot para validar pipeline antes del run completo.

EXPERIMENT_NAME: "ddd_hpo_pilot50-juanjo_classic_v2-gpt_4o_low"
EXPERIMENT_DESCRIPTION: "Pilot 50 casos DDD (Gene2Phenotype G2P, mayo 2025). Validacion pipeline antes del run completo de 1749 casos."

DATASET_PATH: "bench/datasets/ddd_hpo_pilot50.json"

DXGPT_EMULATOR:
  MODEL: "gpt-4o"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
