# Pipeline V4 Configuration — hms_hpo con gemini-3-pro-preview
# ================================================================================
# Objetivo: validar si gemini-3-pro-preview mantiene calidad en HPO vs gemini-2.5-pro
# gemini-2.5-pro: R@1=56.8%, R@3=90.9%, R@5=100.0%, avg_pos=1.693 (run 20260417221140)
# Estimado: ~88 casos × 10s/caso = ~15 min emulación + ~25 min evaluación

EXPERIMENT_NAME: "hms_hpo-juanjo_classic_v2-gemini_3_pro_preview_low"
EXPERIMENT_DESCRIPTION: "HMS HPO 88 casos con gemini-3-pro-preview. Validacion si mantiene calidad vs gemini-2.5-pro (R@1=56.8%). Harvard Medical School dataset."

DATASET_PATH: "bench/datasets/hms_hpo.json"

DXGPT_EMULATOR:
  MODEL: "gemini-3-pro-preview"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
