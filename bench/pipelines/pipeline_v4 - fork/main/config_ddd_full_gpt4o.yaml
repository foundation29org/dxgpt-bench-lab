# Pipeline V4 Configuration — ddd_hpo FULL run 1749 casos con gpt-4o
# ====================================================================
# Run completo post-pilot. Pilot validado: R@1=48%, 100% coverage, avg_pos=2.08.
# Estimado: ~1749 casos × 10s/caso = ~3h emulación + ~2h evaluación

EXPERIMENT_NAME: "ddd_hpo-juanjo_classic_v2-gpt_4o_low"
EXPERIMENT_DESCRIPTION: "DDD full run 1749 casos (Gene2Phenotype G2P mayo 2025). Comparacion directa con paper DeepRare. Pilot R@1=48%, avg_pos=2.08."

DATASET_PATH: "bench/datasets/ddd_hpo.json"

DXGPT_EMULATOR:
  MODEL: "gpt-4o"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
