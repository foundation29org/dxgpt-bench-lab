# Re-evaluación de casos fallados por 503 - lirical_hpo gpt-4o (sin traduccion)
# Casos originales (1-indexed): [299]

EXPERIMENT_NAME: "lirical_hpo_reeval503_gpt4o-juanjo_classic_v2-low"
EXPERIMENT_DESCRIPTION: "Re-eval 1 caso 503 en lirical_hpo gpt-4o. Casos: [299]"

DATASET_PATH: "bench/datasets/lirical_hpo_reeval503_gpt4o.json"

DXGPT_EMULATOR:
  MODEL: "gpt-4o"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: false
  SHOULD_LABEL: false
  SHOULD_EVALUATE: true

TIMESTAMP: null
