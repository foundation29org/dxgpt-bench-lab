# Pipeline V4 Configuration — ddd_hpo FULL run 1749 casos con gemini-2.5-pro low
# ================================================================================
# gpt-4o: R@1=44.9%, R@3=76.8%, R@5=97.0%, avg_pos=2.267 (run 20260418225915)
# gpt-5.4-mini: en curso
# Estimado: ~1749 casos × 28s/caso = ~13h emulación + ~3h evaluación → dejar de noche

EXPERIMENT_NAME: "ddd_hpo-juanjo_classic_v2-gemini_2_5_pro_low"
EXPERIMENT_DESCRIPTION: "DDD full run 1749 casos con gemini-2.5-pro low. En los 5 datasets HPO anteriores gemini gano siempre en R@1. gpt-4o R@1=44.9%, esperamos mejora significativa."

DATASET_PATH: "bench/datasets/ddd_hpo.json"

DXGPT_EMULATOR:
  MODEL: "gemini-2.5-pro"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: false

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
