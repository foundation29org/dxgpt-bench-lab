# Pipeline V4 Configuration — all_256_clean o3-dxgpt high
# =========================================================

EXPERIMENT_NAME: "all_256_clean-juanjo_classic_v2-o3_dxgpt_high_translated_en"
EXPERIMENT_DESCRIPTION: "all_256_clean con o3-dxgpt high. Modelo en producción modo avanzado. Baseline definitivo sobre dataset limpio. Referencia: o3-dxgpt high en all_275 dio 1.680."

DATASET_PATH: "bench/datasets/all_256_clean.json"

DXGPT_EMULATOR:
  MODEL: "o3-dxgpt"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "high"
    thinking_level: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: true

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true

TIMESTAMP: null
