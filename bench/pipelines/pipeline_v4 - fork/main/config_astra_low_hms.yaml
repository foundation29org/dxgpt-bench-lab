EXPERIMENT_NAME: hms_hpo-juanjo_classic_v2-gpt_6_astra_low
EXPERIMENT_DESCRIPTION: >-
  gpt-6-astra low sobre HMS HPO (88 casos). Mismo prompt y juez que Terra/Mini.
  TRANSLATE_CASE off: HPO ya en inglés. Curiosidad de raras; no gate de producto.

DATASET_PATH: bench/datasets/hms_hpo.json

DXGPT_EMULATOR:
  MODEL: gpt-6-astra
  CANDIDATE_PROMPT_PATH: bench/candidate-prompts/juanjo_classic_v2.txt
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: low
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: bench/candidate-prompts/candidate_output_schema.json
  TRANSLATE_CASE:
    ENABLED: false
  PARALLEL_WORKERS: 8

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.8
  BERT_AUTOCONFIRM_THRESHOLD: 0.9
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: gemini-2.5-pro
  JUDGE_PARAMS:
    reasoning_effort: low
    thinking_level: low
    max_tokens: 10000
    temperature: 0.1
  PARALLEL_WORKERS: 8

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true
