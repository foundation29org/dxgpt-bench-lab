EXPERIMENT_NAME: hms_hpo-juanjo_classic_v2-gemini_3_8_flash_low
EXPERIMENT_DESCRIPTION: >-
  gemini-3.8-flash low sobre HMS HPO (88). Mismo prompt que 3.5-flash / Terra.
  TRANSLATE_CASE off. Si no gana R@1 a 3.5 ni a Terra, no ampliar a DDD.

DATASET_PATH: bench/datasets/hms_hpo.json

DXGPT_EMULATOR:
  MODEL: gemini-3.8-flash
  CANDIDATE_PROMPT_PATH: bench/candidate-prompts/juanjo_classic_v2.txt
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    thinking_level: low
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: bench/candidate-prompts/candidate_output_schema.json
  TRANSLATE_CASE:
    ENABLED: false
  PARALLEL_WORKERS: 4

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.8
  BERT_AUTOCONFIRM_THRESHOLD: 0.9
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: gemini-2.5-pro
  JUDGE_PARAMS:
    reasoning_effort: low
    thinking_level: low
    max_tokens: 10000
    temperature: 0.1
  PARALLEL_WORKERS: 4

MAIN:
  SHOULD_EMULATE: true
  SHOULD_LABEL: true
  SHOULD_EVALUATE: true
