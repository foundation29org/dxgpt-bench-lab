# Re-evaluación de casos fallados por 503 - all_256_clean gpt-5-mini
# Casos originales (1-indexed): [14]

EXPERIMENT_NAME: "all_256_clean_reeval503_gpt5mini-juanjo_classic_v2-low"
EXPERIMENT_DESCRIPTION: "Re-eval 1 caso 503 en all_256_clean gpt-5-mini. Casos: [14]"

DATASET_PATH: "bench/datasets/all_256_clean_reeval503_gpt5mini.json"

DXGPT_EMULATOR:
  MODEL: "gpt-5-mini"
  CANDIDATE_PROMPT_PATH: "bench/candidate-prompts/juanjo_classic_v2.txt"
  PARAMS:
    temperature: 0.1
    max_tokens: 12000
    reasoning_effort: "low"
  OUTPUT_SCHEMA: false
  OUTPUT_SCHEMA_PATH: "bench/candidate-prompts/candidate_output_schema.json"
  TRANSLATE_CASE:
    ENABLED: true
    TARGET_LANGUAGE: "en"

EVALUATOR:
  BERT_ACCEPTANCE_THRESHOLD: 0.80
  BERT_AUTOCONFIRM_THRESHOLD: 0.90
  ENABLE_ICD10_PARENT_SEARCH: true
  ENABLE_ICD10_SIBLING_SEARCH: true
  JUDGE_MODEL: "gemini-2.5-pro"
  JUDGE_PARAMS:
    reasoning_effort: "low"
    thinking_level: "low"
    max_tokens: 10000
    temperature: 0.1

MAIN:
  SHOULD_EMULATE: false
  SHOULD_LABEL: false
  SHOULD_EVALUATE: true

TIMESTAMP: null
