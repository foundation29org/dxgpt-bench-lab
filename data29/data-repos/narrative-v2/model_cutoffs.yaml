# Fechas de corte de los modelos evaluados sobre narrative_v2
# ============================================================
# Para saber con qué modelos el bloque `live` (case reports con entrez_date
# desde el 1-jul-2026) es de verdad no visto. Las fuentes dan el mes: se toma
# el último día del mes como corte, que es la lectura prudente.
#
# Comprobado el 28-oct-2026. `live_dates.py` cruza estas fechas con las de
# publicación de cada caso en PubMed.

models:
  gpt-5.4-mini:
