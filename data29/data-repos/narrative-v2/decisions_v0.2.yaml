# Decisiones de la validación clínica de narrative_v2 (tarea 1) para la v0.2.
# Revisión: David Isla, hoja entregada el 4-nov-2026; revisada y aplicada el mismo día.
# Las aplica build_dataset.py --decisions. Sin texto de casos: los cortes de texto
# (fugas, anonimización y limpieza) están en work/text_edits_v0.2.json, fuera de git.
#
# decision: keep | exclude. reason: leak | not_diagnosable | unreliable_gold.
# principal, accepted_names, rare, secondary: valores nuevos (solo si cambian).
# text: leak_removed | anonymized | cleaned.
version: '0.2'
reviewer: David Isla
reviewed: '2026-11-04'
rules:
  leak: hay fuga si el texto nombra el diagnóstico o da un resultado que por sí solo lo establece (biopsia, citología,
    cultivo, serología, prueba confirmatoria, mutación); no la hay si son hallazgos de laboratorio o imagen que
    hay que interpretar
  leak_fix: si la fuga son una o pocas frases que se pueden quitar sin perder el caso, se quitan; si no, se excluye
  not_diagnosable: se excluye
  rare: Orphanet o prevalencia < 1/2.000; intoxicaciones, reacciones a fármacos, lesiones y complicaciones de procedimientos
    no cuentan como raras salvo que Orphanet las recoja
  duplicates: un caso por diagnóstico principal también después de corregir el gold (build_dataset.py)
