    not_diagnosable: 25
    leak: 9
    unreliable_gold: 5
    duplicate: 1
  rules:
    leak: hay fuga si el texto nombra el diagnóstico o da un resultado que por sí
      solo lo establece (biopsia, citología, cultivo, serología, prueba confirmatoria,
      mutación); no la hay si son hallazgos de laboratorio o imagen que hay que interpretar
    leak_fix: si la fuga son una o pocas frases que se pueden quitar sin perder el
      caso, se quitan; si no, se excluye
    not_diagnosable: se excluye
    rare: Orphanet o prevalencia < 1/2.000; intoxicaciones, reacciones a fármacos,
      lesiones y complicaciones de procedimientos no cuentan como raras salvo que
      Orphanet las recoja
    duplicates: un caso por diagnóstico principal también después de corregir el gold
      (build_dataset.py)
