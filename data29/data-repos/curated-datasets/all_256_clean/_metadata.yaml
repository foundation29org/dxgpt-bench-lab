key_finding: >
  Limpiar el boilerplate MEJORÓ los scores en ambos modelos (contra la hipótesis inicial
  que predecía una bajada del 5-8%). Conclusión: el boilerplate en español confundía
  activamente al modelo durante la generación de DDX. El dataset limpio es más difícil
  "en el buen sentido" — sin pistas artificiales.

