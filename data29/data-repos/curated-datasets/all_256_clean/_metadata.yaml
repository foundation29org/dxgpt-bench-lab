  operations:
    - step: 1
      name: Remove label leakage cases
      date: "2026-04-15"
      cases_removed: 19
      result_dataset: bench/datasets/all_256.json
      details: >
        19 casos eliminados por contener el diagnóstico correcto literal en el texto del caso
        (label leakage confirmado por el equipo). Ver docs/pipeline/experiment-log.md §Paso 1.1
    - step: 2
      name: Strip boilerplate prefix/suffix
      date: "2026-04-15"
      cases_cleaned: 49
      result_dataset: bench/datasets/all_256_clean.json  # este dataset
      details: >
        49 casos RAMEDIS tenían boilerplate español artificial añadido durante el ETL.
        Patrón eliminado: "Motivo de consulta: Paciente acude.*?Anamnesis:".
        28 casos T* con prefijo similar NO fueron modificados (narrativas clínicas válidas).
        Ver docs/pipeline/experiment-log.md §Paso 1.2

